name: WakaTime developer metrics
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: "35 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    if: ${{ vars.ENABLE_WAKATIME == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Update README with developer metrics
        uses: anmol098/waka-readme-stats@6a2ec228c5ab57e173ac03586902a0b06b8f9301
        with:
          verbose: "True"
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LOC_CHART: "False"
          SHOW_LINES_OF_CODE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_UPDATED_DATE: "True"
